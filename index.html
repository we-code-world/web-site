	<!DOCTYPE html>
	<html lang="zh-CN">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>新春快乐 | 万象更新</title>
	    <style>
	        /* 页面基础样式 */
	        body, html {
	            margin: 0;
	            padding: 0;
	            width: 100%;
	            height: 100%;
	            overflow: hidden;
	            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
	            background: radial-gradient(circle, #a61c1c 0%, #580000 100%);
	            color: #fff;
	        }
	        /* 烟花画布 */
	        #canvas {
	            position: absolute;
	            top: 0;
	            left: 0;
	            width: 100%;
	            height: 100%;
	            z-index: 1;
	            cursor: pointer;
	        }
	        /* 内容容器 */
	        .container {
	            position: absolute;
	            top: 50%;
	            left: 50%;
	            transform: translate(-50%, -50%);
	            z-index: 2;
	            text-align: center;
	            background: rgba(255, 255, 255, 0.1);
	            backdrop-filter: blur(10px);
	            padding: 40px;
	            border-radius: 20px;
	            border: 1px solid rgba(255, 215, 0, 0.3);
	            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
	            max-width: 90%;
	            width: 400px;
	            animation: fadeIn 1.5s ease-out;
	        }
	        /* 标题与文字样式 */
	        h1 {
	            font-size: 2.5rem;
	            margin-bottom: 20px;
	            color: #ffd700;
	            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
	            font-weight: bold;
	        }
	        .couplet {
	            font-size: 1.2rem;
	            line-height: 1.8;
	            margin-bottom: 20px;
	            color: #fff;
	        }
	        .blessing {
	            font-size: 1rem;
	            line-height: 1.6;
	            color: #eee;
	            text-align: left;
	            background: rgba(0, 0, 0, 0.2);
	            padding: 15px;
	            border-radius: 10px;
	        }
	        .footer {
	            margin-top: 20px;
	            font-size: 0.8rem;
	            color: #ccc;
	        }
	        /* 简单的淡入动画 */
	        @keyframes fadeIn {
	            from { opacity: 0; transform: translate(-50%, -40%); }
	            to { opacity: 1; transform: translate(-50%, -50%); }
	        }
	        /* 提示文字 */
	        .hint {
	            position: absolute;
	            bottom: 20px;
	            width: 100%;
	            text-align: center;
	            color: rgba(255, 255, 255, 0.5);
	            font-size: 0.9rem;
	            z-index: 2;
	            pointer-events: none;
	        }
	    </style>
	</head>
	<body>
	    <!-- 烟花画布 -->
	    <canvas id="canvas"></canvas>
	    <!-- 祝福内容卡片 -->
	    <div class="container">
	        <h1>新春快乐</h1>
	        <div class="couplet">
	            春风送暖千家乐<br>
	            瑞雪迎春万象新
	        </div>
	        <div class="blessing">
	            亲爱的朋友：<br><br>
	            随着新春的钟声敲响，愿你的生活像优雅的算法一样高效，每一天都充满逻辑与和谐。愿你的事业如同不断迭代的软件，日益完善，功能越来越强大。在这个新年里，愿你的烦恼少之又少，幸福和成功不断升级！<br><br>
	            祝万事如意，阖家欢乐！
	        </div>
	        <div class="footer">— 你的朋友 敬上</div>
	    </div>
	    <div class="hint">点击屏幕任意位置燃放烟花</div>
	    <script>
	        // 简单的烟花效果实现
	        const canvas = document.getElementById('canvas');
	        const ctx = canvas.getContext('2d');
	        let particles = [];
	        // 调整画布大小
	        function resize() {
	            canvas.width = window.innerWidth;
	            canvas.height = window.innerHeight;
	        }
	        window.addEventListener('resize', resize);
	        resize();
	        // 粒子类
	        class Particle {
	            constructor(x, y, color) {
	                this.x = x;
	                this.y = y;
	                this.color = color;
	                // 随机速度与角度
	                const angle = Math.random() * Math.PI * 2;
	                const speed = Math.random() * 4 + 1;
	                this.vx = Math.cos(angle) * speed;
	                this.vy = Math.sin(angle) * speed;
	                this.alpha = 1;
	                this.decay = Math.random() * 0.015 + 0.005; // 消失速度
	                this.gravity = 0.05;
	            }
	            update() {
	                this.x += this.vx;
	                this.y += this.vy;
	                this.vy += this.gravity;
	                this.alpha -= this.decay;
	            }
	            draw() {
	                ctx.save();
	                ctx.globalAlpha = this.alpha;
	                ctx.beginPath();
	                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
	                ctx.fillStyle = this.color;
	                ctx.fill();
	                ctx.restore();
	            }
	        }
	        // 创建烟花
	        function createFirework(x, y) {
	            const colors = ['#ff0000', '#ffd700', '#00ff00', '#00ffff', '#ff00ff'];
	            const color = colors[Math.floor(Math.random() * colors.length)];
	            for (let i = 0; i < 40; i++) {
	                particles.push(new Particle(x, y, color));
	            }
	        }
	        // 动画循环
	        function animate() {
	            // 拖尾效果
	            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; 
	            // 注意：这里需要用半透明黑色覆盖来实现拖尾，但因为背景是红色渐变，
	            // 我们用clearRect来保持背景干净，或者使用globalCompositeOperation
	            ctx.clearRect(0, 0, canvas.width, canvas.height);
	            particles.forEach((particle, index) => {
	                if (particle.alpha <= 0) {
	                    particles.splice(index, 1);
	                } else {
	                    particle.update();
	                    particle.draw();
	                }
	            });
	            requestAnimationFrame(animate);
	        }
	        animate();
	        // 点击交互
	        canvas.addEventListener('click', (e) => {
	            createFirework(e.clientX, e.clientY);
	        });
	        // 自动燃放一个作为演示
	        setTimeout(() => {
	            createFirework(window.innerWidth / 2, window.innerHeight / 2);
	        }, 500);
	    </script>
	</body>
	</html>
